<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Trading Dashboard - Monitor your bots in real-time">
  <title>Dashboard | AI Trading Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" src="/src/dashboard.js"></script>
  <style>
    /* Critical inline styles for dashboard layout */
    :root {
      --bg-primary: #070b14;
      --bg-secondary: #0d1321;
      --bg-tertiary: #131b2e;
      --bg-card: rgba(19, 27, 46, 0.7);
      --text-primary: #e4e9f2;
      --text-secondary: #8899b4;
      --accent-primary: #4f8eff;
      --accent-secondary: #22d3a7;
      --accent-warm: #f5a623;
      --accent-danger: #f04e4e;
      --border-color: rgba(79, 142, 255, 0.12);
      --nav-height: 64px;
      --container-max: 1200px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-card: 0 2px 16px rgba(0,0,0,0.25);
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      transition: transform var(--transition-fast);
    }
    .sidebar-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .sidebar-logo {
      width: 32px; height: 32px;
      background: var(--accent-primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 0.875rem;
    }
    .sidebar-brand { font-weight: 700; font-size: 1rem; }
    .sidebar-nav { flex: 1; padding: 1rem 0; overflow-y: auto; }
    .nav-section { padding: 0 1rem; margin-bottom: 1.5rem; }
    .nav-section-title {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted); padding: 0 0.75rem; margin-bottom: 0.5rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.625rem 0.75rem; border-radius: var(--radius-md);
      font-size: 0.875rem; color: var(--text-secondary);
      transition: all var(--transition-fast); cursor: pointer;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav-item.active { background: var(--accent-primary-glow); color: var(--accent-primary); }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .main { flex: 1; margin-left: 260px; padding: 2rem; min-height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-subtle);
    }
    .topbar-title { font-size: 1.25rem; font-weight: 700; }
    .topbar-user { display: flex; align-items: center; gap: 0.75rem; }
    .topbar-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .topbar-name { font-size: 0.875rem; font-weight: 500; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 1.25rem;
      box-shadow: var(--shadow-card); transition: all var(--transition-fast);
    }
    .stat-card:hover { box-shadow: var(--shadow-card-hover); border-color: var(--border-active); }
    .stat-card-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .stat-card-value { font-size: 1.75rem; font-weight: 700; }
    .stat-card-change { font-size: 0.8rem; margin-top: 0.5rem; }
    .stat-card-change.positive { color: var(--accent-secondary); }
    .stat-card-change.negative { color: var(--accent-danger); }
    .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 1.5rem;
      box-shadow: var(--shadow-card);
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .card-title { font-size: 1rem; font-weight: 600; }
    .card-badge {
      font-size: 0.7rem; padding: 0.25rem 0.625rem; border-radius: var(--radius-full);
      background: var(--accent-secondary-glow); color: var(--accent-secondary); font-weight: 500;
    }
    .card-badge.warning { background: var(--accent-warm-glow); color: var(--accent-warm); }
    .card-badge.danger { background: rgba(240,78,78,0.15); color: var(--accent-danger); }
    .bot-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .bot-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.875rem; background: var(--bg-tertiary); border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle); transition: all var(--transition-fast);
    }
    .bot-item:hover { border-color: var(--border-active); }
    .bot-info { display: flex; align-items: center; gap: 0.75rem; }
    .bot-icon {
      width: 40px; height: 40px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
    }
    .bot-icon.running { background: var(--accent-secondary-glow); color: var(--accent-secondary); }
    .bot-icon.paused { background: var(--accent-warm-glow); color: var(--accent-warm); }
    .bot-icon.stopped { background: rgba(240,78,78,0.1); color: var(--accent-danger); }
    .bot-name { font-weight: 600; font-size: 0.875rem; }
    .bot-strategy { font-size: 0.75rem; color: var(--text-muted); }
    .bot-pnl { text-align: right; }
    .bot-pnl-value { font-weight: 600; font-size: 0.875rem; }
    .bot-pnl-value.positive { color: var(--accent-secondary); }
    .bot-pnl-value.negative { color: var(--accent-danger); }
    .bot-pnl-label { font-size: 0.7rem; color: var(--text-muted); }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.5rem;
    }
    .status-dot.running { background: var(--accent-secondary); animation: pulse 1.5s infinite; }
    .status-dot.paused { background: var(--accent-warm); }
    .status-dot.stopped { background: var(--accent-danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .activity-feed { display: flex; flex-direction: column; gap: 0.75rem; }
    .activity-item {
      display: flex; align-items: flex-start; gap: 0.75rem;
      padding: 0.625rem 0; border-bottom: 1px solid var(--border-subtle);
      font-size: 0.8rem;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 0.75rem;
    }
    .activity-icon.buy { background: rgba(34,211,167,0.15); color: var(--accent-secondary); }
    .activity-icon.sell { background: rgba(240,78,78,0.15); color: var(--accent-danger); }
    .activity-icon.info { background: var(--accent-primary-glow); color: var(--accent-primary); }
    .activity-text { flex: 1; color: var(--text-secondary); line-height: 1.4; }
    .activity-time { color: var(--text-muted); font-size: 0.7rem; white-space: nowrap; }
    .mobile-menu-btn {
      display: none; position: fixed; top: 1rem; left: 1rem; z-index: 200;
      width: 40px; height: 40px; border-radius: var(--radius-md);
      background: var(--bg-card-solid); border: 1px solid var(--border-color);
      color: var(--text-primary); align-items: center; justify-content: center;
    }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 99; top: 0; left: 0;
    }
    .sidebar-overlay.active { display: block; }
    @media (max-width: 1024px) {
      .content-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 1rem; padding-top: 4rem; }
      .mobile-menu-btn { display: flex; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    /* Settings Tabs */
    .settings-tabs-container {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0;
      width: 100%;
      margin-bottom: 1rem;
    }
    .settings-tab {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-secondary);
      font-size: 0.9375rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 0;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: inherit;
      letter-spacing: 0.02em;
      flex: 1;
      text-align: center;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .settings-tab:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }
    .settings-tab.active {
      color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
      background: transparent;
    }
    .settings-tab:focus {
      outline: 2px solid var(--accent-primary);
      outline-offset: -2px;
    }
    
    .card-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 1.5rem; 
      flex-wrap: wrap;
      gap: 1rem;
    }
    .settings-tab-content {
      width: 100%;
      padding-top: 1.5rem;
    }
    .settings-panel {
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .settings-panel.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Form elements in settings */
    input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select {
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      font-size: 0.9rem;
    }
    input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus, input[type="password"]:focus, select:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-primary-glow);
    }
    
    /* Radio/Checkbox styling */
    input[type="radio"], input[type="checkbox"] {
      accent-color: var(--accent-primary);
      cursor: pointer;
      width: 20px;
      height: 20px;
    }
    
    /* Button variants */
    .btn-secondary {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      transition: all var(--transition-fast);
    }
    .btn-secondary:hover {
      background: var(--bg-card);
      border-color: var(--border-active);
    }
    .btn-danger {
      background: var(--accent-danger);
      border: 1px solid var(--accent-danger);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      transition: all var(--transition-fast);
    }
    .btn-danger:hover {
      filter: brightness(1.1);
    }
    
    /* Exchange form sections */
    .exchange-section {
      padding: 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
    }
    .exchange-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .exchange-field {
      margin-bottom: 1rem;
    }
    .exchange-field:last-child {
      margin-bottom: 0;
    }
    .exchange-field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
      font-weight: 500;
    }
    .exchange-field .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .exchange-field .input-row {
      display: flex;
      gap: 0.75rem;
      align-items: stretch;
    }
    .exchange-field .input-row > * {
      min-height: 2.75rem;
    }
    .exchange-field .input-row input[type="text"],
    .exchange-field .input-row input[type="password"] {
      flex: 1;
    }
    .exchange-field .input-row select {
      width: 120px;
      flex-shrink: 0;
    }
    
    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      transition: all var(--transition-fast);
    }
    .toggle-slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background: var(--text-secondary);
      border-radius: 50%;
      transition: all var(--transition-fast);
    }
    .toggle-switch input:checked + .toggle-slider {
      background: var(--accent-primary-glow);
      border-color: var(--accent-primary);
    }
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
      background: var(--accent-primary);
    }
    
    /* Radio group */
    .radio-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
    }
    .radio-option:hover {
      border-color: var(--border-active);
      background: var(--bg-card);
    }
    .radio-option:has(input:checked) {
      border-color: var(--accent-primary);
      background: var(--accent-primary-glow);
    }
    .radio-option input {
      accent-color: var(--accent-primary);
    }
    
    /* Checkbox group */
    .checkbox-group {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.375rem 0;
    }
    
    /* Test result */
    .test-result {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .test-result.success {
      background: rgba(34, 211, 167, 0.15);
      color: var(--accent-secondary);
      border: 1px solid rgba(34, 211, 167, 0.3);
    }
    .test-result.error {
      background: rgba(240, 78, 78, 0.15);
      color: var(--accent-danger);
      border: 1px solid rgba(240, 78, 78, 0.3);
    }
    .test-result.loading {
      background: rgba(79, 142, 255, 0.15);
      color: var(--accent-primary);
      border: 1px solid rgba(79, 142, 255, 0.3);
    }
    
    /* Action buttons row */
    .action-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }
    
    /* Info banner */
    .info-banner {
      padding: 0.75rem 1rem;
      background: rgba(79, 142, 255, 0.1);
      border: 1px solid rgba(79, 142, 255, 0.2);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .info-banner .info-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }
    
    /* Responsive */
    @media (max-width: 640px) {
      .settings-tabs {
        width: 100%;
        margin-left: 0;
        margin-top: 0.5rem;
      }
      .settings-tab {
        flex: 1;
        text-align: center;
        padding: 0.625rem 1rem;
      }
      .card-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .exchange-field .input-row {
        flex-direction: column;
      }
      .exchange-field .input-row select {
        width: 100%;
      }
      .radio-group {
        flex-direction: column;
        gap: 0.5rem;
      }
      .checkbox-group {
        flex-direction: column;
        gap: 0.75rem;
      }
      .action-row {
        flex-direction: column;
      }
    }
  </style>
</head>

          <button class="nav-item" data-page="portfolio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="2" x2="12" y2="22"/><path d="M12 2a10 10 0 0 1 10 10c0 5.5-4.5 10-10 10S2 17.5 2 12"/></svg>

          </button>
        </div>
        <div class="nav-section">
