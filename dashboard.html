<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Trading Dashboard - Monitor your bots in real-time">
  <title>Dashboard | AI Trading Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" src="/src/dashboard.js"></script>
  <style>
    /* Critical inline styles for dashboard layout */
    :root {
      --bg-primary: #070b14;
      --bg-secondary: #0d1321;
      --bg-tertiary: #131b2e;
      --bg-card: rgba(19, 27, 46, 0.7);
      --bg-card-solid: #131b2e;
      --bg-input: rgba(13, 19, 33, 0.8);
      --text-primary: #e4e9f2;
      --text-secondary: #8899b4;
      --text-muted: #5a6a8a;
      --accent-primary: #4f8eff;
      --accent-secondary: #22d3a7;
      --accent-warm: #f5a623;
      --accent-danger: #f04e4e;
      --accent-primary-glow: rgba(79, 142, 255, 0.15);
      --accent-secondary-glow: rgba(34, 211, 167, 0.15);
      --accent-warm-glow: rgba(245, 166, 35, 0.15);
      --border-color: rgba(79, 142, 255, 0.12);
      --border-subtle: rgba(79, 142, 255, 0.08);
      --border-active: rgba(79, 142, 255, 0.3);
      --nav-height: 64px;
      --container-max: 1200px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --shadow-card: 0 2px 16px rgba(0,0,0,0.25);
      --shadow-card-hover: 0 8px 32px rgba(0,0,0,0.35);
      --shadow-lg: 0 16px 48px rgba(0,0,0,0.4);
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      transition: transform var(--transition-fast);
    }
    .sidebar-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .sidebar-logo {
      width: 32px; height: 32px;
      background: var(--accent-primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 0.875rem;
    }
    .sidebar-brand { font-weight: 700; font-size: 1rem; }
    .sidebar-nav { flex: 1; padding: 1rem 0; overflow-y: auto; }
    .nav-section { padding: 0 1rem; margin-bottom: 1.5rem; }
    .nav-section-title {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted); padding: 0 0.75rem; margin-bottom: 0.5rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.625rem 0.75rem; border-radius: var(--radius-md);
      font-size: 0.875rem; color: var(--text-secondary);
      transition: all var(--transition-fast); cursor: pointer;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav-item.active { background: var(--accent-primary-glow); color: var(--accent-primary); }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .main { flex: 1; margin-left: 260px; padding: 2rem; min-height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-subtle);
      gap: 1rem;
    }
    .topbar-actions {
      display: flex; align-items: center; gap: 0.5rem;
    }
    .topbar-title { font-size: 1.25rem; font-weight: 700; }
    .topbar-user { display: flex; align-items: center; gap: 0.75rem; }
    .topbar-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .topbar-name { font-size: 0.875rem; font-weight: 500; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 1.25rem;
      box-shadow: var(--shadow-card); transition: all var(--transition-fast);
    }
    .stat-card:hover { box-shadow: var(--shadow-card-hover); border-color: var(--border-active); }
    .stat-card-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .stat-card-value { font-size: 1.75rem; font-weight: 700; }
    .stat-card-change { font-size: 0.8rem; margin-top: 0.5rem; }
    .stat-card-change.positive { color: var(--accent-secondary); }
    .stat-card-change.negative { color: var(--accent-danger); }
    .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 1.5rem;
      box-shadow: var(--shadow-card);
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .card-title { font-size: 1rem; font-weight: 600; }
    .card-badge {
      font-size: 0.7rem; padding: 0.25rem 0.625rem; border-radius: var(--radius-full);
      background: var(--accent-secondary-glow); color: var(--accent-secondary); font-weight: 500;
    }
    .card-badge.warning { background: var(--accent-warm-glow); color: var(--accent-warm); }
    .card-badge.danger { background: rgba(240,78,78,0.15); color: var(--accent-danger); }
    .bot-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .bot-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.875rem; background: var(--bg-tertiary); border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle); transition: all var(--transition-fast);
    }
    .bot-item:hover { border-color: var(--border-active); }
    .bot-info { display: flex; align-items: center; gap: 0.75rem; }
    .bot-icon {
      width: 40px; height: 40px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
    }
    .bot-icon.running { background: var(--accent-secondary-glow); color: var(--accent-secondary); }
    .bot-icon.paused { background: var(--accent-warm-glow); color: var(--accent-warm); }
    .bot-icon.stopped { background: rgba(240,78,78,0.1); color: var(--accent-danger); }
    .bot-name { font-weight: 600; font-size: 0.875rem; }
    .bot-strategy { font-size: 0.75rem; color: var(--text-muted); }
    .bot-pnl { text-align: right; }
    .bot-pnl-value { font-weight: 600; font-size: 0.875rem; }
    .bot-pnl-value.positive { color: var(--accent-secondary); }
    .bot-pnl-value.negative { color: var(--accent-danger); }
    .bot-pnl-label { font-size: 0.7rem; color: var(--text-muted); }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.5rem;
    }
    .status-dot.running { background: var(--accent-secondary); animation: pulse 1.5s infinite; }
    .status-dot.paused { background: var(--accent-warm); }
    .status-dot.stopped { background: var(--accent-danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .activity-feed { display: flex; flex-direction: column; gap: 0.75rem; }
    .activity-item {
      display: flex; align-items: flex-start; gap: 0.75rem;
      padding: 0.625rem 0; border-bottom: 1px solid var(--border-subtle);
      font-size: 0.8rem;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 0.75rem;
    }
    .activity-icon.buy { background: rgba(34,211,167,0.15); color: var(--accent-secondary); }
    .activity-icon.sell { background: rgba(240,78,78,0.15); color: var(--accent-danger); }
    .activity-icon.info { background: var(--accent-primary-glow); color: var(--accent-primary); }
    .activity-text { flex: 1; color: var(--text-secondary); line-height: 1.4; }
    .activity-time { color: var(--text-muted); font-size: 0.7rem; white-space: nowrap; }
    .mobile-menu-btn {
      display: none; position: fixed; top: 1rem; left: 1rem; z-index: 200;
      width: 40px; height: 40px; border-radius: var(--radius-md);
      background: var(--bg-card-solid); border: 1px solid var(--border-color);
      color: var(--text-primary); align-items: center; justify-content: center;
    }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 99; top: 0; left: 0;
    }
    .sidebar-overlay.active { display: block; }
    @media (max-width: 1024px) {
      .content-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 1rem; padding-top: 4rem; }
      .mobile-menu-btn { display: flex; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-header">
        <div class="sidebar-logo">AI</div>
        <span class="sidebar-brand">AI Trading</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Utama</div>
          <button class="nav-item active" data-page="overview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span data-i18n="dash.nav.overview">Overview</span>
          </button>
          <button class="nav-item" data-page="bots">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 2a4 4 0 0 0-4 4v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z"/><circle cx="12" cy="14" r="2"/></svg>
            <span data-i18n="dash.nav.bots">Bots</span>
          </button>
          <button class="nav-item" data-page="trades">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
            <span data-i18n="dash.nav.trades">Trades</span>
          </button>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Analisis</div>
          <button class="nav-item" data-page="performance">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span data-i18n="dash.nav.performance">Performance</span>
          </button>
          <button class="nav-item" data-page="portfolio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="2" x2="12" y2="22"/><path d="M12 2a10 10 0 0 1 10 10c0 5.5-4.5 10-10 10S2 17.5 2 12"/></svg>
            <span data-i18n="dash.nav.portfolio">Portfolio</span>
          </button>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Lainnya</div>
          <button class="nav-item" data-page="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.96.36l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.36-1.96l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.96-.36l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span data-i18n="dash.nav.settings">Pengaturan</span>
          </button>
        </div>
        <div class="nav-section">
          <button class="nav-item btn-logout" data-page="logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span data-i18n="dash.nav.logout">Keluar</span>
          </button>
        </div>
      </nav>
    </aside>
    <main class="main" id="mainContent" role="main">
      <div class="topbar">
        <h1 class="topbar-title" id="pageTitle">Overview</h1>
        <div class="topbar-actions">
          <!-- Language Selector - Toggle Style -->
          <div class="language-selector" role="group" aria-label="Pilih bahasa">
            <button class="lang-btn lang-toggle" data-lang="id" aria-pressed="true" aria-label="Bahasa Indonesia">
              <span class="lang-flag" aria-hidden="true">🇮🇩</span>
              <span class="lang-text">ID</span>
              <svg class="lang-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="14" height="14">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>
            <div class="lang-dropdown" role="listbox" aria-label="Pilih bahasa">
              <button class="lang-dropdown-item active" data-lang="id" role="option" aria-selected="true">
                <span class="lang-flag" aria-hidden="true">🇮🇩</span>
                <span class="lang-text">Bahasa Indonesia</span>
              </button>
              <button class="lang-dropdown-item" data-lang="en" role="option" aria-selected="false">
                <span class="lang-flag" aria-hidden="true">🇺🇸</span>
                <span class="lang-text">English</span>
              </button>
            </div>
          </div>
          
          <!-- Theme Toggle -->
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="18" height="18">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="18" height="18">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
        <div class="topbar-user">
          <img src="" alt="" class="topbar-avatar" id="topbarAvatar">
          <span class="topbar-name" id="topbarName"></span>
        </div>
      </div>
      <div id="pageContent"></div>
    </main>
  </div>
</body>
</html>
